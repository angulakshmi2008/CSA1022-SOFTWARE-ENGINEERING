version: '3.8'

services:
  notes-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notes-express-container
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - IS_DOCKER=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
