upstream backend_cluster {
    # Round-robin distribution between the two stateless backend instances
    server backend-1:8000 max_fails=3 fail_timeout=10s;
    server backend-2:8000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    # Frontend single page app
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }

    # Load balanced API routing
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Transparent failover if one instance restarts
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
