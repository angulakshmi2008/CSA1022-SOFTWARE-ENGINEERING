version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fulfiliq-postgres
    restart: always
    environment:
      POSTGRES_DB: fulfiliq_db
      POSTGRES_USER: fulfiliq_user
      POSTGRES_PASSWORD: fulfiliq_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfiliq_user -d fulfiliq_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  fastapi-backend-1:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: fulfiliq-api-1
    restart: always
    environment:
      - DATABASE_PATH=/app/backend/fulfiliq.db
      - SECRET_KEY=academic-assignment-fulfiliq-secure-jwt-key-2026
      - GATEWAY_HMAC_SECRET=webhook-secret-hmac-sha256-key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net

  fastapi-backend-2:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: fulfiliq-api-2
    restart: always
    environment:
      - DATABASE_PATH=/app/backend/fulfiliq.db
      - SECRET_KEY=academic-assignment-fulfiliq-secure-jwt-key-2026
      - GATEWAY_HMAC_SECRET=webhook-secret-hmac-sha256-key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net

  outbox-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: fulfiliq-outbox-worker
    command: python -c "import time; from backend.app.database import get_db; from backend.app.workers.outbox_worker import process_pending_outbox_intents; from backend.app.workers.expiry_worker import expire_unpaid_reservations; print('Outbox Worker Daemon Started...'); [time.sleep(5) or (lambda c: (process_pending_outbox_intents(c), expire_unpaid_reservations(c)))(conn) for conn in [get_db().__enter__()]]"
    restart: always
    environment:
      - DATABASE_PATH=/app/backend/fulfiliq.db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net

  nginx-proxy:
    image: nginx:alpine
    container_name: fulfiliq-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "8000:8000"
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi-backend-1
      - fastapi-backend-2
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge
