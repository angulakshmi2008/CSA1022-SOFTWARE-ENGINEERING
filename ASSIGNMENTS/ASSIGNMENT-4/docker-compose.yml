version: '3.8'

services:
  campus-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-campus-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite:///./smart_campus.db
      - SECRET_KEY=prod-insecure-secret-key-change-in-production-192524402
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - DEFAULT_MAX_BOOKING_MINUTES=180
      - DEFAULT_SENSOR_TEMP_THRESHOLD=28.0
    volumes:
      - campus_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  campus_data:
    driver: local
