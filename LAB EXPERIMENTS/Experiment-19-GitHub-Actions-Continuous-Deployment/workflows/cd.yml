name: CD - Build, Push and Deploy

# Note: As per Safety Rule 9, this workflow YAML is preserved inside the experiment folder
# (LAB EXPERIMENTS/Experiment-19-GitHub-Actions-Continuous-Deployment/workflows/cd.yml).
# To activate in a standalone repository, copy this file to .github/workflows/cd.yml.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/gha-docker-cd
  STUDENT_AUTHOR: "Angulakshmi S"
  REG_NO: "192524402"

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # Deployment Target Option A: AWS ECS (Fargate)
      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy Container to AWS ECS
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          aws ecs update-service --cluster gha-cluster \
            --service gha-service --force-new-deployment

      # Deployment Target Option B: Webhook / Cloud PaaS (e.g., Render / Cloud Run)
      - name: Trigger Cloud Continuous Deployment
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
