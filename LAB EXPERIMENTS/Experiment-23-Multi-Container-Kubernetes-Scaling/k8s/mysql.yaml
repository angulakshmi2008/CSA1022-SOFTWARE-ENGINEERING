apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: multiapp
type: Opaque
stringData:
  ROOT_PASSWORD: college_root_secure_pw
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-config
  namespace: multiapp
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS college;
    USE college;
    CREATE TABLE IF NOT EXISTS students (
        id INT AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        dept VARCHAR(100) NOT NULL
    );
    INSERT INTO students (name, dept) VALUES
        ('Angulakshmi S', 'CSE - AI & Data Science (192524402)'),
        ('Priya Sharma', 'Information Technology'),
        ('Rahul Kumar', 'Computer Science & Engineering'),
        ('Sneha Patel', 'AI & Machine Learning');
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: multiapp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: multiapp
  labels:
    app: mysql
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mysql
        tier: database
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: college
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: init-script
          configMap:
            name: mysql-init-config
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: multiapp
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
