<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Hub Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            padding: 30px;
            text-align: center;
        }
        h1 {
            color: #086dd6;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            background-color: #e3f2fd;
            color: #0277bd;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin: 5px;
        }
        .meta-box {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.95rem;
            color: #666;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello from Docker Hub!</h1>
        <p>This image was pushed to and pulled from Docker Hub successfully.</p>
        <div>
            <span class="badge">Nginx Alpine</span>
            <span class="badge">Docker Hub Registry</span>
            <span class="badge">Port 8080:80</span>
        </div>
        <div class="meta-box">
            <p><strong>Student Name:</strong> Angulakshmi S</p>
            <p><strong>Register Number:</strong> 192524402</p>
            <p><strong>Course:</strong> CSA10 - Software Engineering Laboratory</p>
            <p><strong>Institution:</strong> Saveetha School of Engineering, SIMATS</p>
        </div>
    </div>
</body>
</html>
